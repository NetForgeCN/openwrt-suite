# sources.conf — openwrt-suite 上游同步映射表
#
# 格式（字段以 | 分隔）:
#   slug|git-url|branch|mode|payload
#
#   slug   : 唯一标识，用于 meta/ 目录、sources.lock 记录、补丁挂钩 patches/<slug>.sh
#   mode=pkg  : payload = 要拷贝的包目录（空格分隔），逐个拷到 packages/<basename>/；
#               适用于「一个仓库里一个或多个包目录」的上游（Makefile 在各子目录里，
#               仓库根没有 Makefile；只含一个包目录时 payload 就写一个目录）。
#               允许写上游内的子路径（如 openwrt/luci-app-foo），目标目录取 basename ——
#               顶层目录（如 luci-app-ddns-go）basename 不变，行为与以前完全一致
#   mode=all  : payload = 目标包目录名，整个仓库内容（除 .git）拷到 packages/<payload>/；
#               适用于「Makefile 在仓库根目录」的上游
#   mode=file : payload = "源路径 目标路径"，仅下载该文件（适合作大仓库里的单个文件）
#
# 补丁挂钩: patches/<slug>.sh 若存在，会在同步完该源之后自动执行，
#           参数为包目录的绝对路径（mode=pkg 时每个目标包目录各调用一次），
#           环境变量 SUITE_SRC_DIR = 本轮的上游克隆目录（可以从里面取包目录没带的
#           文件，比如仓库根上的 Cargo 工程）；
#           补丁脚本必须自带校验并在失败时退出非 0，这样上游重构导致补丁失配时
#           CI 会立刻报红，而不是静默产出坏快照。
#
# 注意: branch 必须与上游默认分支一致（见 sources.lock 中记录的上游 commit）。
# 信任锚: sources.lock 中的 40 位 commit SHA，而不是这里的 branch。默认同步只取
#         lock 中固定的 commit；SUITE_SYNC_UPDATE=1 才解析分支头并写入新 pin。
#         两文件字段布局保持不变，仍由人工维护/同步脚本整体发布。

# ---- 多包目录型上游（mode=pkg）----
ddnsgo|https://github.com/sirpdboy/luci-app-ddns-go.git|main|pkg|luci-app-ddns-go ddns-go
kixdns|https://github.com/JohnsonRan/luci-app-kixdns.git|main|pkg|kixdns kixdns-stats luci-app-kixdns
diskman|https://github.com/sbwml/luci-app-diskman.git|main|pkg|luci-app-diskman
dae|https://github.com/QiuSimons/luci-app-dae.git|kix|pkg|dae luci-app-dae
opennexttrace|https://github.com/haohaoget/luci-app-open_nexttrace.git|main|pkg|luci-app-open_nexttrace open-nexttrace-core
airplay2|https://github.com/NetForgeCN/luci-app-airplay2.git|main|pkg|airplay2 nqptp luci-app-airplay2
# honk: eBPF 透明代理（dae 兼容），默认分支是 master。
# 仓库根目录还有 scripts/（维护者刷新版本号用）、PIC/（README 截图）、.github/，
# 这几个都不参与构建，所以用 mode=pkg 只拷两个包目录；根目录没有 Makefile，
# 整仓库拷贝（mode=all）会被同步脚本判为「缺少 Makefile」直接失败。
# honk/ 自带 build_honk_core.sh + honk_toolchain.sh + files/，拷出来可独立编译。
honk|https://github.com/QiuSimons/luci-app-honk.git|master|pkg|honk luci-app-honk
# photondns: 高性能 DNS 转发器（Rust）。三个包的目录都藏在 openwrt/ 子目录里，
# 仓库根上是 Cargo 工程（Cargo.toml / Cargo.lock / build.rs / src/），所以 payload
# 写子路径，目标目录取 basename：photondns / luci-app-photondns /
# luci-app-photondns-compat（第三个是给没有 ucode+JS 客户端的旧 LuCI 用的 Lua/CBI 版）。
# 上游 openwrt/photondns/Makefile 用 RustBinPackage 直接编译「包目录里的」Cargo 工程，
# 但包里只带了 Makefile 和 root/，工程本体在仓库根 —— 由 patches/photondns.sh 在同步后
# 从上游克隆里 stage 进 packages/photondns/src/，否则 cargo install 找不到 Cargo.toml。
photondns|https://github.com/c2h2/luci-app-photondns.git|main|pkg|openwrt/photondns openwrt/luci-app-photondns openwrt/luci-app-photondns-compat
# nikki: mihomo（Clash.Meta）的 OpenWrt 透明代理套件，一个仓库四个包：
#   nikki          —— 主包（nftables/ucode 脚本、init.d、UCI 配置），DEPENDS 里写的是
#                     虚拟包 +mihomo，由下面两个内核包之一 PROVIDES 提供
#   mihomo-meta    —— 稳定版内核（DEFAULT_VARIANT，选 nikki 时默认拉这个）
#   mihomo-alpha   —— alpha 版内核，与 meta 互斥（PROVIDES/CONFLICTS 都在）
#   luci-app-nikki —— LuCI 界面（JS 视图 + ucode rpcd 后端）
# 四个目录都在仓库顶层、各自带 Makefile，根目录的 install.sh/uninstall.sh/feed.sh
# 是一键安装脚本，不参与构建，所以用 mode=pkg 只拷这四个目录。
# 两个内核包走 golang-package.mk（PKG_SOURCE_PROTO:=git 指向 MetaCubeX/mihomo），
# 编译时由 buildroot 自动准备 golang/host，不需要额外的宿主机工具。
nikki|https://github.com/nikkinikki-org/OpenWrt-nikki.git|main|pkg|luci-app-nikki nikki mihomo-meta mihomo-alpha
# mosdns: 插件式 DNS 转发器（Go）。默认分支是 v5（不是 main/master！），
# 一个仓库三个包，目录都在顶层、各自带 Makefile：
#   mosdns          —— 主程序（GoBinPackage：IrineSistiana/mosdns v5.3.4 源码 + 30 个补丁）
#   luci-app-mosdns —— LuCI 界面（htdocs/ 视图 + ucode rpcd 后端 + 中文 po）
#   geo2txt         —— 解包 geosite.dat / geoip.dat 的 C 工具（luci-app 的硬依赖）
# 根目录 install.sh 是给用户装预编译 ipk 的，不参与构建，按 mode=pkg 只拷这三个目录。
# 上游 README 里两条构建前置在这里都不需要：
#   1) 替换 feeds/packages/lang/golang 为 sbwml 的 26.x 分支 —— 构建库已自行处理 golang；
#   2) 删官方 v2ray-geodata 再 clone sbwml/v2ray-geodata —— 本仓库的 geodata 源
#      （packages/v2ray-geodata，直接同步 NetForgeCN/Loyalsoldier）已经提供
#      v2ray-geoip / v2ray-geosite，再放一份会撞包名。
mosdns|https://github.com/sbwml/luci-app-mosdns.git|v5|pkg|mosdns luci-app-mosdns geo2txt
# openappfilter: 基于 DPI 的应用过滤 / 家长控制。默认分支是 master（不是 main）。
# 一个仓库三个包目录，都在顶层、各自带 Makefile；注意「目录名 != 包名」：
#   luci-app-oaf    -> luci-app-oaf（Lua/CBI 界面，LUCI_DEPENDS 依赖
#                       +appfilter +kmod-oaf +luci-compat +luci-lib-jsonc）
#   open-app-filter -> appfilter（用户态守护 oafd + 特征库 + Lua 规则脚本）
#   oaf             -> kmod-oaf（netfilter 内核模块，源码在 src/）
# 选 luci-app-oaf 会自动把另外两个拉上。上游根 LICENSE 是 GPL-2.0 全文，
# 由 sync.sh 收进 meta/openappfilter/；README 另有「个人免费、商用需授权」的
# 附加声明（见 README 的 openappfilter 章节）。
openappfilter|https://github.com/destan19/OpenAppFilter.git|master|pkg|luci-app-oaf open-app-filter oaf
# atomdns: 自有的一体化 LuCI 包（Rust DNS 分流器）。
# 仓库根只有 README / LICENSE，包本体在 luci-app-atomdns/ 子目录（根目录没有
# Makefile，不能用 mode=all）；mode=pkg 只拷这一个目录，目标目录取 basename。
# Makefile 在编译期由 Download/ 规则从 jasonxtt/atomdns 的 v0.6.6 release 下载
# musl 静态二进制与 config_rust.zip，逐架构 SHA256 校验后随 ipk 打包，开机不联网；
# 仅支持 x86_64 / aarch64 / armv7。上游根 LICENSE（GPL-3.0）由 sync.sh 收进 meta/atomdns/。
atomdns|https://github.com/NetForgeCN/luci-app-atomdns.git|main|pkg|luci-app-atomdns

# ---- 整仓库即一个包（mode=all）----
temp-status|https://github.com/gSpotx2f/luci-app-temp-status.git|master|all|luci-app-temp-status
argon|https://github.com/jerrykuku/luci-theme-argon.git|master|all|luci-theme-argon
pulse|https://github.com/w9315273/luci-app-pulse.git|main|all|luci-app-pulse
# oxidns: 用自有仓库（基于 svenshi 版本改造，v0.2.0）
# 注意：仓库根 Makefile 是 luci-app-oxidns，内部还嵌了 oxidns-core/Makefile 子包，
# mode=all 会整仓库拷贝，嵌套子包由 OpenWrt 递归扫描自动识别
oxidns|https://github.com/NetForgeCN/luci-app-oxidns.git|main|all|luci-app-oxidns
# lucky: 自有打包层（基于 FloatingDream528 的纯 JS LuCI + 官方静态核心）。
# 与 oxidns 同一形态：仓库根 Makefile 是 luci-app-lucky，内部嵌 lucky/ 核心子包，
# mode=all 整仓拷贝后由 OpenWrt 递归扫描识别两个包。
# 核心在编译期由 PKG_SOURCE 下载并 sha256 校验后装进固件，init.d 不会在开机时
# 联网拉取；版本由仓库侧 .github/workflows/bump.yml 每日检测官网并改写 pin。
# 快照里会带上 .github/、scripts/、assets.json 等非包文件（无 Makefile，不参与扫描）。
lucky|https://github.com/NetForgeCN/luci-app-lucky.git|main|all|luci-app-lucky
# v2ray-geodata: 直接同步自建仓库 NetForgeCN/Loyalsoldier（fork 自 sbwml/v2ray-geodata）。
# 该仓库只有一份 Makefile；规则数据的下载地址与 SHA256 由 patches/geodata.sh
# 钉到 NetForgeCN/v2ray-rules-dat 的固定 release（latest 会指向无数据资产的备份
# release，且同源 .sha256sum 不能防 origin 篡改），因此同步后必须应用该补丁。
# 三库同源：suite 走本 geodata 源，OpenWRT / OpenWrt-ScriptBuild 走
# replace_v2ray_geodata() 的 git clone，产出的 v2ray-geoip / v2ray-geosite 内容一致。
# 上游 sbwml/v2ray-geodata 自 2025-01-25 起停更，旧「同步上游 + patches/geodata.sh
# 重打定制」方案已移除，避免 URL 在两处各存一份导致三库数据分叉。
geodata|https://github.com/NetForgeCN/Loyalsoldier.git|master|all|v2ray-geodata
# hevsocks5: 自有的 hev-socks5-server LuCI 控制页（MIT）。仓库根就是包目录，
# Makefile / LICENSE / README / po / htdocs / root 都在根上，mode=all 整仓拷成
# packages/luci-app-hevsocks5/，LICENSE 随快照留在包目录内。
# LUCI_DEPENDS 是 +hev-socks5-server +luci-base：服务端本体由官方 packages feed 的
# net/hev-socks5-server 提供（三库 .config 已选 CONFIG_PACKAGE_hev-socks5-server=y），
# 名字与依赖都能对上，不需要在 suite 里再聚合一份同名包。
hevsocks5|https://github.com/NetForgeCN/luci-app-hevsocks5.git|main|all|luci-app-hevsocks5

# ---- 单文件型（mode=file）----
# .config 跟随 NetForgeCN/OpenWRT main 分支
config|https://github.com/NetForgeCN/OpenWRT.git|main|file|.config config/dot.config
