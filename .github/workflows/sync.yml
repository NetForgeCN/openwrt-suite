name: daily-sync

on:
  schedule:
    # 每天 18:30 UTC = 北京时间 02:30（上游一天内的更新次日清晨即可拿到）
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write   # 仅同步流程需要提交快照；同步脚本本身不发布 Release

concurrency:
  group: daily-sync
  # 不允许中途取消：sync.sh 会整体替换 packages/ 与 sources.lock
  cancel-in-progress: false

env:
  # sources.lock 是唯一信任锚；只有显式 UPDATE=1 才解析上游分支头并更新 pin
  SUITE_SYNC_UPDATE: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync upstream snapshots
        run: bash scripts/sync.sh

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "上游无变化，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: update snapshots from upstream ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
          echo "已提交同步结果："
          git log --stat -1 | head -n 30
