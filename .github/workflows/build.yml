name: OpenWrt Firmware Build (x86, suite)

on:
  schedule:
    # 每天 18:45 UTC = 北京时间 02:45。
    # daily-sync 是 18:30 UTC（02:30 北京），留 15 分钟给它收尾；构建用独立 cron，
    # 同步失败不阻塞出固件（只是当晚用前一天的快照）。
    # 热构建约 3~3.5 小时，08:00 前完成；首次冷构建可能超 5 小时，建议先手动跑一次预热。
    - cron: "45 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 固件构建一跑数小时：宁可排队也不要取消在跑的构建
concurrency:
  group: firmware-build
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive
  WORKDIR: ${{ github.workspace }}/openwrt
  # 用本次 checkout 的 suite（脚本、packages、config/dot.config 都来自同一提交，
  # compile.sh 默认就从 $SUITE_DIR/config/dot.config 取配置），不再让脚本自己克隆/更新
  SUITE_DIR: ${{ github.workspace }}
  SKIP_UPDATE: "1"
  RELEASE_DIR: ${{ github.workspace }}/release-assets
  # 与 rules.mk 在 CONFIG_CCACHE=y 时的取值保持一致（openwrt/.ccache，不是 ~/.ccache）
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  # ============================================================
  # build：只给读权限。这一步会执行大量第三方 feeds / 软件包的
  # Makefile，万一上游被投毒，也不该拿到仓库写权限。
  # ============================================================
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Init environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y \
            clang llvm lld unzip ccache \
            bzip2 g++ gawk gcc git glibc-source libncurses-dev make \
            python3 rsync file patch bison flex zlib1g-dev libssl-dev \
            libelf-dev bc cpio gettext swig time
          sudo timedatectl set-timezone Asia/Shanghai
          sudo apt-get -qq autoremove --purge -y
          sudo apt-get -qq clean

      # 完整历史（不用浅克隆），`git log -- tools toolchain` 才能算出稳定的缓存 key
      - name: Clone source
        run: |
          git clone -b main https://github.com/openwrt/openwrt "$WORKDIR"
          cd "$WORKDIR"
          echo "OpenWrt commit: $(git rev-parse HEAD)"
          echo "OPENWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Compute toolchain hash
        id: toolchain-hash
        run: |
          HASH=$(git -C "$WORKDIR" log --pretty=tformat:%h -n1 -- tools toolchain)
          echo "hash=${HASH:-none}" >> "$GITHUB_OUTPUT"

      # dl 缓存：key 绑定 dot.config / compile.sh，配置变了才换 key
      - name: Cache dl
        uses: actions/cache@v6
        with:
          path: openwrt/dl
          key: dl-suite-x86-${{ hashFiles('config/dot.config', 'build/compile.sh') }}
          restore-keys: |
            dl-suite-x86-

      # 工具链缓存（staging_dir，含 rust/host 等宿主工具，命中后省 1.5~2.5 小时）
      - name: Restore toolchain cache
        id: toolchain-restore
        uses: actions/cache/restore@v6
        with:
          path: openwrt/staging_dir
          key: toolchain-suite-x86-${{ steps.toolchain-hash.outputs.hash }}
          restore-keys: |
            toolchain-suite-x86-

      # ccache：key 带 run_id 每轮存新快照，靠 restore-keys 前缀命中上一轮
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: openwrt/.ccache
          key: ccache-suite-x86-${{ steps.toolchain-hash.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            ccache-suite-x86-${{ steps.toolchain-hash.outputs.hash }}-
            ccache-suite-x86-

      - name: Run compile.sh
        env:
          TOOLCHAIN_KEY: toolchain-suite-x86-${{ steps.toolchain-hash.outputs.hash }}
        run: |
          set -o pipefail
          mkdir -p "$CCACHE_DIR" "$RELEASE_DIR"
          ccache -M 3G
          ccache -z
          chmod +x build/compile.sh
          # compile.sh 内部完成：feeds 配置/安装 -> .config -> honk 工具链 ->
          # 内核补丁 -> download -> 编译；honk 工具链按 .config 自动按需安装
          ./build/compile.sh 2>&1 | tee compile.log

      - name: Collect release assets
        run: |
          shopt -s nullglob
          cp -a "$WORKDIR"/bin/targets/x86/64/*.img.gz \
                "$WORKDIR"/bin/targets/x86/64/*.img \
                "$WORKDIR"/bin/targets/x86/64/*.bin \
                "$WORKDIR"/bin/targets/x86/64/*.manifest \
                "$WORKDIR"/bin/targets/x86/64/*.buildinfo \
                "$RELEASE_DIR/" 2>/dev/null || true
          shopt -u nullglob

          MAIN=$(find "$WORKDIR/bin/targets" -type f -name "*squashfs-combined-efi.img.gz" -size +5M | head -n1)
          [ -n "$MAIN" ] || { echo "::error::未生成有效的 squashfs-combined-efi 固件"; exit 1; }

          {
            echo "Build Time: $(TZ=Asia/Shanghai date)"
            echo "OpenWrt Commit: ${OPENWRT_COMMIT:-unknown}"
            echo "suite Commit: ${{ github.sha }}"
            echo "Toolchain Key: toolchain-suite-x86-${{ steps.toolchain-hash.outputs.hash }}"
            echo
            echo "快照对应的上游版本（sources.lock）："
            awk -F'|' '{ printf "  %s @ %s\n", $1, substr($2, 1, 10) }' sources.lock
          } > "$RELEASE_DIR/release-notes.txt"
          ls -lh "$RELEASE_DIR/"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-x86-64
          path: release-assets/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: openwrt-build-logs
          path: |
            compile.log
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: openwrt/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Save toolchain cache
        if: always() && steps.toolchain-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: openwrt/staging_dir
          key: ${{ steps.toolchain-restore.outputs.cache-primary-key }}

  # ============================================================
  # release：发布固件，保留最近 7 个 Release
  # ============================================================
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware-x86-64
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="OpenWrt-$(TZ=Asia/Shanghai date +"%Y%m%d-%H%M")-${GITHUB_RUN_ID: -6}"
          echo "Release tag: $TAG"

          [ -f release-assets/release-notes.txt ] ||
            { echo "::error::缺少 release-assets/release-notes.txt"; exit 1; }

          shopt -s nullglob
          files=(release-assets/*.img.gz release-assets/*.img release-assets/*.bin \
                 release-assets/*.manifest release-assets/*.buildinfo)
          shopt -u nullglob

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::release-assets/ 下没有找到任何固件文件"
            exit 1
          fi

          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --title "$TAG" \
            --notes-file release-assets/release-notes.txt \
            "${files[@]}"

          echo "Release 创建完成：https://github.com/$GH_REPO/releases/tag/$TAG"

      - name: Delete old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEEP_RELEASES=7

          LIST="$(gh release list \
            --repo "$GH_REPO" \
            --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[].tagName')"

          TAGS=()
          while IFS= read -r line; do
            [ -n "$line" ] && TAGS+=("$line")
          done <<< "$LIST"

          echo "当前 Release 数量：${#TAGS[@]}（保留最新 $KEEP_RELEASES 个）"
          if [ "${#TAGS[@]}" -le "$KEEP_RELEASES" ]; then
            exit 0
          fi

          for tag in "${TAGS[@]:$KEEP_RELEASES}"; do
            gh release delete "$tag" --repo "$GH_REPO" -y --cleanup-tag || true
          done
