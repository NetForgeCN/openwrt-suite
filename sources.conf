# sources.conf — openwrt-suite 上游同步映射表
#
# 格式（字段以 | 分隔）:
#   slug|git-url|branch|mode|payload
#
#   slug   : 唯一标识，用于 meta/ 目录、sources.lock 记录、补丁挂钩 patches/<slug>.sh
#   mode=pkg  : payload = 要拷贝的包目录（空格分隔），逐个拷到 packages/<basename>/；
#               适用于「一个仓库里多个包目录」的上游（Makefile 在各子目录里）。
#               允许写上游内的子路径（如 openwrt/luci-app-foo），目标目录取 basename ——
#               顶层目录（如 luci-app-ddns-go）basename 不变，行为与以前完全一致
#   mode=all  : payload = 目标包目录名，整个仓库内容（除 .git）拷到 packages/<payload>/；
#               适用于「Makefile 在仓库根目录」的上游
#   mode=file : payload = "源路径 目标路径"，仅下载该文件（适合作大仓库里的单个文件）
#
# 补丁挂钩: patches/<slug>.sh 若存在，会在同步完该源之后自动执行，
#           参数为包目录的绝对路径（mode=pkg 时每个目标包目录各调用一次），
#           环境变量 SUITE_SRC_DIR = 本轮的上游克隆目录（可以从里面取包目录没带的
#           文件，比如仓库根上的 Cargo 工程）；
#           补丁脚本必须自带校验并在失败时退出非 0，这样上游重构导致补丁失配时
#           CI 会立刻报红，而不是静默产出坏快照。
#
# 注意: branch 必须与上游默认分支一致（见 sources.lock 中记录的上游 commit）。

# ---- 多包目录型上游（mode=pkg）----
ddnsgo|https://github.com/sirpdboy/luci-app-ddns-go.git|main|pkg|luci-app-ddns-go ddns-go
kixdns|https://github.com/JohnsonRan/luci-app-kixdns.git|main|pkg|kixdns kixdns-stats luci-app-kixdns
diskman|https://github.com/sbwml/luci-app-diskman.git|main|pkg|luci-app-diskman
dae|https://github.com/QiuSimons/luci-app-dae.git|kix|pkg|dae luci-app-dae
opennexttrace|https://github.com/haohaoget/luci-app-open_nexttrace.git|main|pkg|luci-app-open_nexttrace open-nexttrace-core
airplay2|https://github.com/NetForgeCN/luci-app-airplay2.git|main|pkg|airplay2 nqptp luci-app-airplay2
# honk: eBPF 透明代理（dae 兼容），默认分支是 master。
# 仓库根目录还有 scripts/（维护者刷新版本号用）、PIC/（README 截图）、.github/，
# 这几个都不参与构建，所以用 mode=pkg 只拷两个包目录；根目录没有 Makefile，
# 整仓库拷贝（mode=all）会被同步脚本判为「缺少 Makefile」直接失败。
# honk/ 自带 build_honk_core.sh + honk_toolchain.sh + files/，拷出来可独立编译。
honk|https://github.com/QiuSimons/luci-app-honk.git|master|pkg|honk luci-app-honk
# photondns: 高性能 DNS 转发器（Rust）。三个包的目录都藏在 openwrt/ 子目录里，
# 仓库根上是 Cargo 工程（Cargo.toml / Cargo.lock / build.rs / src/），所以 payload
# 写子路径，目标目录取 basename：photondns / luci-app-photondns /
# luci-app-photondns-compat（第三个是给没有 ucode+JS 客户端的旧 LuCI 用的 Lua/CBI 版）。
# 上游 openwrt/photondns/Makefile 用 RustBinPackage 直接编译「包目录里的」Cargo 工程，
# 但包里只带了 Makefile 和 root/，工程本体在仓库根 —— 由 patches/photondns.sh 在同步后
# 从上游克隆里 stage 进 packages/photondns/src/，否则 cargo install 找不到 Cargo.toml。
photondns|https://github.com/c2h2/luci-app-photondns.git|main|pkg|openwrt/photondns openwrt/luci-app-photondns openwrt/luci-app-photondns-compat

# ---- 整仓库即一个包（mode=all）----
temp-status|https://github.com/gSpotx2f/luci-app-temp-status.git|master|all|luci-app-temp-status
argon|https://github.com/jerrykuku/luci-theme-argon.git|master|all|luci-theme-argon
pulse|https://github.com/w9315273/luci-app-pulse.git|main|all|luci-app-pulse
# oxidns: 用自有仓库（基于 svenshi 版本改造，v0.2.0）
# 注意：仓库根 Makefile 是 luci-app-oxidns，内部还嵌了 oxidns-core/Makefile 子包，
# mode=all 会整仓库拷贝，嵌套子包由 OpenWrt 递归扫描自动识别
oxidns|https://github.com/NetForgeCN/luci-app-oxidns.git|main|all|luci-app-oxidns
# v2ray-geodata: 用 NetForgeCN/Loyalsoldier 这个 fork 的源头 sbwml/v2ray-geodata 同步，
# 同步后由 patches/geodata.sh 重打 GEOIP_URL 补丁（改用全量 geoip.dat，保留 fork 原有定制）
geodata|https://github.com/sbwml/v2ray-geodata.git|master|all|v2ray-geodata

# ---- 单文件型（mode=file）----
# .config 跟随 NetForgeCN/OpenWRT main 分支
config|https://github.com/NetForgeCN/OpenWRT.git|main|file|.config config/dot.config
